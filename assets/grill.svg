<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Panggangan di atas bara">
  <defs>
    <clipPath id="inside">
      <circle cx="60" cy="60" r="52"/>
    </clipPath>
    <radialGradient id="ember" cx="50%" cy="62%" r="58%">
      <stop offset="0%" stop-color="#ffb060"/>
      <stop offset="45%" stop-color="#e0702e"/>
      <stop offset="100%" stop-color="#8a3a14"/>
    </radialGradient>
  </defs>

  <!-- alas bara, wajan tidak mengambang -->
  <ellipse cx="60" cy="96" rx="46" ry="10" fill="#7a3413" opacity="0.55"/>

  <!-- nyala bara di bawah kisi -->
  <circle cx="60" cy="60" r="52" fill="url(#ember)"/>

  <!-- kisi besi: tebal dan jarak bervariasi, bukan pola seragam -->
  <g clip-path="url(#inside)" stroke="#241d19" stroke-linecap="round" opacity="0.96">
    <line x1="4" y1="22" x2="116" y2="22" stroke-width="7"/>
    <line x1="6" y1="36" x2="114" y2="36" stroke-width="5"/>
    <line x1="4" y1="50" x2="116" y2="50" stroke-width="8"/>
    <line x1="7" y1="65" x2="113" y2="65" stroke-width="5"/>
    <line x1="4" y1="79" x2="116" y2="79" stroke-width="7"/>
    <line x1="6" y1="94" x2="114" y2="94" stroke-width="6"/>
    <line x1="6" y1="107" x2="114" y2="107" stroke-width="4"/>
  </g>

  <!-- rim besi -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#51433a" stroke-width="9"/>
  <circle cx="60" cy="60" r="55.5" fill="none" stroke="#0c1822" stroke-width="2" opacity="0.55"/>

  <!-- pegangan: menyambung ke rim dengan bayangan sambungan -->
  <g transform="rotate(-14 10 60)">
    <rect x="-22" y="53" width="52" height="15" rx="7" fill="#463a31"/>
    <rect x="-20" y="55.5" width="44" height="3.5" rx="1.75" fill="#6b584a" opacity="0.6"/>
    <ellipse cx="30" cy="60.5" rx="7" ry="9" fill="#241d19" opacity="0.75"/>
    <rect x="24" y="50" width="10" height="21" rx="4" fill="#3a2f28"/>
  </g>
</svg>
